# NovaOS GRUB2 Live CD Boot Configuration
set timeout=5
set default=0

# Futuristic Dark Cyan Visual Theme
set color_normal=cyan/black
set color_highlight=black/light-cyan

menuentry "NovaOS 1.0 (Live CD - Futuristic Secure Desktop)" --class os {
    echo "Starting NovaOS Secure Boot Sequence..."
    echo "Loading Hardened Linux Kernel (x86_64)..."
    linux /boot/vmlinuz-novaos boot=live quiet splash novaos.mode=live novaos.security=strict security=apparmor page_alloc.shuffle=1 randomize_kstack_offset=on init_on_alloc=1 init_on_free=1 slab_nomerge pti=on
    echo "Loading Cryptographic Initramfs & Nova Defender..."
    initrd /boot/initrd-novaos.img
}

menuentry "NovaOS 1.0 Installer (Install to NVMe / SSD with LUKS2 AES-256)" --class installer {
    echo "Starting NovaOS Setup Wizard..."
    linux /boot/vmlinuz-novaos boot=live quiet splash novaos.mode=installer novaos.autoinstall=0
    initrd /boot/initrd-novaos.img
}

menuentry "NovaOS 1.0 (Hardware Diagnostics & TPM 2.0 Security Audit)" --class recovery {
    echo "Running System Integrity Verification..."
    linux /boot/vmlinuz-novaos boot=live quiet novaos.mode=diagnostics audit=1
    initrd /boot/initrd-novaos.img
}

menuentry "NovaOS BitLocker / Vault Recovery Console" --class rescue {
    echo "Launching Encrypted Volume Recovery..."
    linux /boot/vmlinuz-novaos boot=live rescue novaos.mode=recovery
    initrd /boot/initrd-novaos.img
}
