UI vesamenu.c32
PROMPT 0
TIMEOUT 50
TOTALTIMEOUT 300

MENU TITLE NovaOS Hyperion 2026 - Boot Options
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ffff #a0000000 std
MENU COLOR sel          7;37;40 #e0000000 #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std

LABEL live
    MENU LABEL NovaOS 1.0 (Live CD - Run in RAM)
    KERNEL /boot/vmlinuz-novaos
    INITRD /boot/initrd-novaos.img
    APPEND boot=live quiet splash novaos.mode=live novaos.security=hardened

LABEL install
    MENU LABEL NovaOS 1.0 (Direct Installation to NVMe/SSD)
    KERNEL /boot/vmlinuz-novaos
    INITRD /boot/initrd-novaos.img
    APPEND boot=live quiet splash novaos.mode=installer

LABEL diagnostics
    MENU LABEL NovaOS Hardware Diagnostics & TPM 2.0 Audit
    KERNEL /boot/vmlinuz-novaos
    INITRD /boot/initrd-novaos.img
    APPEND boot=live quiet novaos.mode=diag
