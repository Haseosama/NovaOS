DEFAULT novaos
TIMEOUT 15
PROMPT 0

UI vesamenu.c32
MENU TITLE NovaOS Hyperion 2026 - Windows 11 Live CD
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ffff #a0000000 std
MENU COLOR sel          7;37;40 #e0000000 #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std

LABEL novaos
    MENU LABEL NovaOS 1.0 (Windows 11 Futuristic Graphical Desktop)
    KERNEL /boot/vmlinuz64
    INITRD /boot/initrd.gz
    APPEND quiet splash vga=792 video=1024x768-32 loglevel=3

LABEL install
    MENU LABEL NovaOS 1.0 Installer (Install to SSD with LUKS2 AES-256)
    KERNEL /boot/vmlinuz64
    INITRD /boot/initrd.gz
    APPEND quiet splash vga=792 video=1024x768-32 novaos.mode=installer

LABEL failsafe
    MENU LABEL NovaOS 1.0 Safe Mode (VESA Framebuffer Fallback)
    KERNEL /boot/vmlinuz64
    INITRD /boot/initrd.gz
    APPEND nomodeset xvesa=1024x768x32
