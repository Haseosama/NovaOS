DEFAULT novaos
PROMPT 0
TIMEOUT 20

LABEL novaos
    KERNEL /boot/vmlinuz
    INITRD /boot/initrd.gz
    APPEND quiet splash vga=792 video=1024x768-32 loglevel=3

LABEL linux
    KERNEL /boot/vmlinuz
    INITRD /boot/initrd.gz
    APPEND quiet splash vga=792 video=1024x768-32 loglevel=3

LABEL start
    KERNEL /boot/vmlinuz
    INITRD /boot/initrd.gz
    APPEND quiet splash vga=792 video=1024x768-32 loglevel=3

LABEL install
    KERNEL /boot/vmlinuz
    INITRD /boot/initrd.gz
    APPEND quiet splash vga=792 video=1024x768-32 novaos.mode=installer
