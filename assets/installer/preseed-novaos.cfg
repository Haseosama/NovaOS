# NovaOS — preseed debian-installer (solution de repli)
#
# Ce fichier n'est PAS utilisé par la construction par défaut (NovaOS embarque
# l'installateur graphique Calamares). Il sert de référence si vous préférez
# construire l'ISO avec l'installateur Debian classique (d-i) :
#   1. remplacez « --debian-installer calamares » par « --debian-installer true »
#      dans build.sh ;
#   2. copiez ce fichier dans config/includes.installer/preseed.cfg
#      (live-build le transmet à l'installateur).
#
# Points clés : chiffrement LUKS complet du disque par défaut, français,
# Europe/Paris, pas de compte root utilisable en console.

# — Partitionnement : disque entier chiffré en LUKS —
d-i partman-auto/method string crypto
d-i partman-crypto/passphrase password changez-moi-12-caracteres
d-i partman-crypto/passphrase-again password changez-moi-12-caracteres
d-i partman-auto/choose_recipe select atomic
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# — Miroir Debian —
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# — Localisation —
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true

# — Compte : pas de login root direct, compte utilisateur avec sudo —
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i user-setup/allow-password-weak boolean false

# — Réseau —
d-i netcfg/enable boolean true
d-i netcfg/choose_interface select auto

# — Paquets : bureau KDE complet
d-i pkgsel/include string kde-desktop firefox-esr libreoffice vlc
tasksel tasksel/first multiselect desktop, standard

# — Post-installation : activer le pare-feu et les mises à jour auto —
d-i preseed/late_command string \
    in-target systemctl enable ufw ; \
    in-target systemctl enable unattended-upgrades ; \
    in-target sed -i 's/^ENABLED=.*/ENABLED=yes/' /etc/ufw/ufw.conf ; \
    in-target ufw default deny incoming ; \
    in-target ufw default allow outgoing ; \
    in-target apt-get update
