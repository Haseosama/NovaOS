name: Build NovaOS ISO

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "config/**"
      - "assets/**"
      - "build.sh"
      - ".github/workflows/build-iso.yml"
  pull_request:
    paths:
      - "config/**"
      - "assets/**"
      - "build.sh"
      - ".github/workflows/build-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    name: NovaOS — construction de l'ISO (Debian live-build)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 240
    steps:
      - name: Installation des dépendances de build
        run: |
          apt-get update
          # git + certificats sont requis par actions/checkout dans le conteneur.
          # Les outils syslinux/grub servent à produire une ISO hybride BIOS+UEFI.
          apt-get install -y --no-install-recommends \
            ca-certificates git live-build debootstrap xorriso squashfs-tools rsync wget \
            isolinux syslinux-common syslinux-utils grub-pc-bin grub-efi-amd64-bin mtools \
            debian-archive-keyring
        shell: bash

      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Construction de l'ISO
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee "$RUNNER_TEMP/novaos-build.log"
        shell: bash

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          {
            echo "## Diagnostic de construction NovaOS"
            echo '```text'
            if [ -f "$RUNNER_TEMP/novaos-build.log" ]; then
              tail -n 100 "$RUNNER_TEMP/novaos-build.log"
            else
              echo "Le journal de construction n'est pas disponible."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$RUNNER_TEMP/novaos-build.log" ]; then
            diagnostic="$(tail -n 35 "$RUNNER_TEMP/novaos-build.log")"
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            echo "::error title=NovaOS build diagnostic::$diagnostic"
          fi
        shell: bash

      - name: Somme de contrôle SHA256
        run: |
          ISO="$(ls novaos-*.iso | head -n1)"
          sha256sum "$ISO" | tee "${ISO}.sha256sums"

      - name: Publication de l'ISO (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: novaos-iso
          path: |
            novaos-*.iso
            novaos-*.iso.sha256sums
          if-no-files-found: error
          retention-days: 30
