---
# NovaOS — Calamares : partitionnement
#
# À l'installation, choisissez « Effacer le disque » puis cochez « Chiffrer » :
# le disque entier est alors chiffré en LUKS (recommandé pour la sécurité).

# Table de partition GPT (recommandé, compatible UEFI)
partitionTableType: gpt

# Système de fichiers par défaut : ext4 (éprouvé et journalisé)
defaultFileSystemType: ext4

# Propositions de swap
userSwapChoices:
    - none
    - file
    - partition
neverCreateSwap: false

# Chiffrement LUKS proposé dans l'interface
enableLuksSupport: true

# Confirmation avant suppression d'une partition
showDeletePartitionConfirmation: true
