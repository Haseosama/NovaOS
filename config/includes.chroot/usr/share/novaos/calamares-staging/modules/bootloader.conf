---
# NovaOS — Calamares : chargeur de démarrage GRUB
# Identifiant UEFI « NovaOS », noyau/params par défaut de Debian.

efiBootLoader: "grub"
efiBootloaderId: "NovaOS"
kernelSearchPath: "/boot"
kernelName: "vmlinuz"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
kernel: "vmlinuz"
imgName: "initrd.img"
kernelParams: [ "quiet", "splash" ]
