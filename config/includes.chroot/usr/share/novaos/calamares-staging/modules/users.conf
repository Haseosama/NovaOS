---
# NovaOS — Calamares : création du compte utilisateur
# Mot de passe : 12 caractères minimum, complexité requise (politique NovaOS).

defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - users
    - netdev
    - lpadmin
    - scanner
    - bluetooth

# Un mot de passe root est défini à l'installation (pas de compte root sans mot de passe)
setRootPassword: true

# Démarrage automatique sur le bureau (choix NovaOS — désactivable ensuite).
# La connexion automatique est écrite au démarrage par le service NovaOS
# novaos-autologin-setup.service (/etc/sddm.conf.d/99-novaos-autologin.conf),
# qui respecte le réglage /etc/novaos/autologin.conf. On laisse Calamares ne
# PAS écrire d'autologin dans /etc/sddm.conf (fichier prioritaire chez SDDM
# sur /etc/sddm.conf.d/) afin que ce réglage reste autoritaire.
doAutologin: false

doReusePassword: false
userShell: /bin/bash

passwordRequirements:
    minLength: 12
    maxLength: 64
