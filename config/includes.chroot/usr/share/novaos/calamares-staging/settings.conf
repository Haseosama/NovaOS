---
# NovaOS — configuration de l'installateur Calamares
# (déployée dans /etc/calamares/settings.conf par le hook 0150-installer)

# Où chercher les modules Calamares (selon le chemin utilisé par Debian)
modules-search: [ /usr/lib/calamares/modules, /usr/lib/x86_64-linux-gnu/calamares/modules ]

# Branding NovaOS (dossier /usr/share/calamares/branding/novaos/)
branding: novaos

# Séquence d'installation : pages affichées, puis exécution
sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - bootloader
        - grubcfg
        - initramfs
        - removeuser
        - finished

# Options générales
prompt-install: true
dont-chroot: false
oem-setup: false
