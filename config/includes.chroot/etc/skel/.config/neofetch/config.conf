# NovaOS — configuration neofetch (repli si fastfetch est indisponible)

print_info() {
    info title
    info underline
    info "OS" distro
    info "Hôte" model
    info "Noyau" kernel
    info "Uptime" uptime
    info "Paquets" packages
    info "Shell" shell
    info "DE" de
    info "WM" wm
    info "Thème" theme
    info "Icônes" icons
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Mémoire" memory
    info "Disque" disk
}

# Logo ASCII NovaOS
image_backend="ascii"
image_source="/usr/share/novaos/novaos-ascii.txt"
ascii_distros="NovaOS"
ascii_colors=(12 14)
bold="on"
colors=(12 14 15 7 7 7)
