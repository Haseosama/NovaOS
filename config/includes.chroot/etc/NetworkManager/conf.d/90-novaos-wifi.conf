# NovaOS — Wi-Fi fiable
[device]
# Pas d'adresse MAC aléatoire pendant la recherche des réseaux : certaines
# box et cartes Wi-Fi (Realtek, Broadcom, Intel) n'attribuent alors jamais
# d'adresse IP (« Configuration IP non disponible »)
wifi.scan-rand-mac-address=no

[connection]
# L'adresse MAC réelle de la carte est utilisée pour se connecter
wifi.cloned-mac-address=permanent
ethernet.cloned-mac-address=permanent
# Pas de mise en veille de la carte Wi-Fi (cause fréquente d'échecs DHCP)
wifi.powersave=2
# Laisser plus de temps à la box pour répondre (DHCP lent au premier essai)
ipv4.dhcp-timeout=90
# Une box sans IPv6 ne doit pas faire échouer la connexion
ipv4.may-fail=false
ipv6.may-fail=true
