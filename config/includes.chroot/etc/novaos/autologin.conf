# NovaOS — connexion automatique sur le bureau
#
# true  : NovaOS démarre directement sur le bureau KDE (sans mot de passe).
# false : un mot de passe est demandé à chaque démarrage (écran de connexion).
#
# Après modification, redémarrer (ou relancer novaos-autologin-setup.service).
NOVAOS_AUTOLOGIN=true
