# NovaOS — réglages noyau pour les jeux
# Nombre de zones mémoire par programme : certains jeux récents (via Proton)
# en ont besoin de beaucoup plus que la valeur par défaut (même valeur que SteamOS)
vm.max_map_count=2147483642
# Ne pas ralentir volontairement les jeux qui font des « split locks »
# (sinon saccades dans certains jeux Windows)
kernel.split_lock_mitigate=0
