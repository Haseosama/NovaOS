# NovaOS — réglages noyau orientés bureau (fluidité)
# Avec zram, échanger vers la RAM compressée est peu coûteux.
vm.swappiness=100
vm.page-cluster=0
# Garder en cache l'arborescence des fichiers (explorateur plus vif)
vm.vfs_cache_pressure=50
# Écritures disque en petits paquets : moins de saccades pendant les copies
vm.dirty_background_ratio=5
vm.dirty_ratio=10
# Regroupe les tâches par session : l'interface reste prioritaire
kernel.sched_autogroup_enabled=1
