# NovaOS — configuration live-config (SESSION LIVE UNIQUEMENT)
#
# live-config ne s'exécute que sur l'ISO live (son unité systemd exige
# « boot=live » sur la ligne de commande du noyau) : ce fichier est donc
# inerte sur un système installé.
#
# Groupes de l'utilisateur live « user » (créé au démarrage par live-boot) :
# cette liste REMPLACE les groupes par défaut de live-config, d'où la reprise
# de la liste complète.
#   - « sudo »       : l'utilisateur live peut s'authentifier auprès de polkit
#                      (agent graphique KDE) avec son mot de passe « live » ;
#   - « novaos-live » : groupe NovaOS — vide sur un système installé, il n'a
#                      de membres que dans la session live. Il sert à la règle
#                      polkit qui autorise l'icône « Installer NovaOS » à lancer
#                      Calamares sans mot de passe (voir
#                      /etc/polkit-1/rules.d/49-novaos-live-installer.rules).
LIVE_USER_DEFAULT_GROUPS="audio cdrom dip floppy video plugdev netdev powerdev scanner bluetooth sudo novaos-live"
